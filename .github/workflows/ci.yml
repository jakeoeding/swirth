name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Build
        run: swift build

  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Test
        run: swift test --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Lint
        uses: norio-nomura/action-swiftlint@3.2.1
